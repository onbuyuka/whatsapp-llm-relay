version: 2
# Use the npm directory's public registry settings, not local feed credentials.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Majors held back on purpose; see the "remaining PRs" review (2026-10-25).
    # @azure/identity is pinned to 4.13.0: newer releases need Node 22+ (the relay
    # supports Node 20) and the 4.14 upgrade reported two vulnerable packages.
    # @types/node follows the Node runtime.
    ignore:
      - dependency-name: "@azure/identity"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: dotenv
        update-types: ["version-update:semver-major"]
      - dependency-name: pino
        update-types: ["version-update:semver-major"]
